# Local environment (specs/containerization/, specs/database-migrations/).
#
# Startup order: db (healthy) -> migrate (exits 0) -> api (healthy); seed runs
# after migrate and nothing waits on it; adminer waits for db.
# Host ports (set in .env): API_PORT 8080, ADMINER_PORT 8081,
# SWAGGER_UI_PORT 8082, POSTGRES_PORT 5432.
# Image versions are pinned on purpose - review them before raising.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workshop}
      POSTGRES_DB: ${POSTGRES_DB:-automotive_workshop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # No docker-entrypoint-initdb.d scripts: the schema is created only by the
    # migrate service below (specs/database-migrations/, one initialization path).
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations/ before the API starts. A failure (e.g. a Fase 1
  # volume, which must be adopted with `make migrate-baseline` first) stops
  # `docker compose up` and the API is not started.
  migrate:
    image: migrate/migrate:v4.20.1 # keep in sync with MIGRATE_IMAGE in scripts/migrate.sh
    command:
      - -path=/migrations
      - -database
      - postgres://${POSTGRES_USER:-workshop}:${POSTGRES_PASSWORD:-workshop}@db:5432/${POSTGRES_DB:-automotive_workshop}?sslmode=disable
      - up
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  # One-shot: development sample data and users (docs/seed.sql, idempotent),
  # after the migrations, on every `up`. Nothing waits on it, so a seed failure
  # never keeps the API down.
  seed:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-workshop}
      PGPASSWORD: ${POSTGRES_PASSWORD:-workshop}
      PGDATABASE: ${POSTGRES_DB:-automotive_workshop}
    command: ["psql", "-X", "-q", "-v", "ON_ERROR_STOP=1", "-f", "/seed/seed.sql"]
    volumes:
      - ./docs/seed.sql:/seed/seed.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  adminer:
    image: adminer:6.1.1
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

  # Health is reported by the image's HEALTHCHECK (GET /health). PORT is not set:
  # inside the container the API stays on 8080; API_PORT only changes the host side.
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-workshop}:${POSTGRES_PASSWORD:-workshop}@db:5432/${POSTGRES_DB:-automotive_workshop}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - set it in .env}
      JWT_TTL: ${JWT_TTL:-1h}
      EXTERNAL_NOTIFICATION_SECRET: ${EXTERNAL_NOTIFICATION_SECRET:?EXTERNAL_NOTIFICATION_SECRET is required - set it in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.33.1
    restart: unless-stopped
    environment:
      SWAGGER_JSON: /openapi.yaml
    volumes:
      - ./docs/openapi.yaml:/openapi.yaml:ro
    ports:
      - "${SWAGGER_UI_PORT:-8082}:8080"

volumes:
  db_data:
