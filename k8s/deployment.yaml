# API Deployment (specs/kubernetes-deployment/design.md §3). Never applied raw: the deploy
# renders the image as ghcr.io/os-fiapudos/automotive-workshop-api:<sha>@sha256:<digest>
# (specs/ci-cd-pipeline/design.md §5) and applies it only after the migration Job is
# Complete (k8s/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: automotive-workshop-api
  namespace: automotive-workshop
  labels:
    app.kubernetes.io/name: automotive-workshop-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: automotive-workshop
spec:
  # No `replicas`: the HorizontalPodAutoscaler (hpa.yaml) owns the replica count, so
  # re-applying this file never resets a scaled-out Deployment.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: automotive-workshop-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: automotive-workshop-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: automotive-workshop
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/os-fiapudos/automotive-workshop-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: automotive-workshop-api-config
            - secretRef:
                name: automotive-workshop-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            # The API does not handle SIGTERM; the delay lets the Service stop routing to
            # this pod before the process is stopped (design.md §3).
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
