# KEY REFERENCE ONLY — NEVER APPLY THIS FILE.
#
# Documents the keys of the two Secrets the deploy creates (specs/kubernetes-deployment/
# design.md §2). Applying it would overwrite real credentials with placeholders, which is
# why it lives outside the top level of k8s/ (`kubectl apply -f k8s/` is not recursive).
# Create the real Secrets with the commands in k8s/README.md, or let FP-36's
# scripts/deploy.sh `config` stage create them. A local copy with real values must be
# named *.local.yaml (git-ignored) and never committed.
apiVersion: v1
kind: Secret
metadata:
  name: automotive-workshop-api-secrets
  namespace: automotive-workshop
type: Opaque
stringData:
  # postgres_database_url_template (terraform output) with <password> replaced by the
  # percent-encoded Postgres password.
  DATABASE_URL: "REPLACE_ME"
  # At least 32 bytes (openssl rand -hex 32).
  JWT_SECRET: "REPLACE_ME"
  # Two different random values; the API refuses to start when they are equal.
  EXTERNAL_NOTIFICATION_SECRET: "REPLACE_ME"
  EXTERNAL_STATUS_UPDATE_SECRET: "REPLACE_ME"
  # Optional pair: set both or neither (neither disables the quote e-mail).
  RESEND_API_KEY: ""
  RESEND_FROM_EMAIL: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: automotive-workshop-admin-bootstrap
  namespace: automotive-workshop
type: Opaque
stringData:
  ADMIN_EMAIL: "REPLACE_ME"
  # 12 to 72 bytes.
  ADMIN_PASSWORD: "REPLACE_ME"
  ADMIN_NAME: "Administrador"
