openapi: 3.0.3
info:
  title: automotive-workshop-api â€” Customer & Vehicle Management
  description: >
    Auth, Customer Management, Vehicle Management, Service catalog, Product &
    Stock Management, Service Order opening/diagnosis/quote/execution, Service
    Order listing/detail (specs/service-order-query/), and Service Order
    Tracking (specs/service-order-tracking/) endpoints for the automotive
    workshop API. See specs/auth/, specs/customer-management/,
    specs/vehicle-management/, specs/service-catalog/,
    specs/product-management/, specs/service-order-opening/,
    specs/service-order-diagnosis-quote/, specs/service-order-quote-decision/,
    specs/service-order-execution/, specs/service-order-query/, and
    specs/service-order-tracking/ for the requirements and design behind
    these contracts. Every route requires a JWT (see the bearerAuth security
    scheme) except POST /api/v1/auth/login itself (since it is what issues
    the token) and Service Order Tracking plus the customer-facing quote
    approve/reject endpoints, which validate their own per-order tracking
    token instead (see the trackingToken security scheme). Customer routes
    and Service Order creation were wrapped in bearerAuth on 2026-08-26,
    closing the open decision recorded in
    specs/customer-management/requirements.md §7.2 and CLAUDE.md §1.
  version: "1.0.0"
servers:
  - url: http://localhost:8080
    description: Local (docker-compose) or `go run ./cmd/api`

tags:
  - name: auth
    description: >
      Administrative login and session identity (specs/auth/). Issues the
      JWT every other bearerAuth-protected route requires.
  - name: customers
    description: Create and maintain workshop customers (individuals via CPF, companies via CNPJ).
  - name: vehicles
    description: >
      Create and maintain workshop vehicles, each linked to an existing,
      active customer. Every endpoint requires a valid JWT.
  - name: services
    description: >
      Maintain the catalog of services and prices quotes are composed from
      (specs/service-catalog/). Every endpoint requires a valid JWT; deletion
      is logical (an `active` flag), preserving history for BR5/BR7.
  - name: products
    description: >
      Maintain the catalog of parts (`PART`) and supplies (`SUPPLY`), their
      stock balance, and stock movement history
      (specs/product-management/). Every endpoint requires a valid JWT.
      Route segments are kept in Portuguese (`produtos`/`estoque`/
      `ajustes`/`movimentacoes`) by the same deliberate exception CLAUDE.md
      Â§8 documents for the ServiceOrder status enum â€” do not translate them.
  - name: service-orders
    description: >
      Open a service order and drive it through its full lifecycle: creation
      (specs/service-order-opening/), diagnosis and quote composition
      (specs/service-order-diagnosis-quote/), quote sending
      (specs/service-order-quote-decision/), execution, finalization, and
      delivery (specs/service-order-execution/), plus listing/detail
      (specs/service-order-query/). Every endpoint here requires a valid JWT
      (order creation was wrapped in bearerAuth on 2026-08-26, see
      CLAUDE.md §1). The
      customer-facing quote approval/rejection endpoints live under the
      `tracking` tag instead, since they authenticate with a tracking token,
      not a JWT (specs/service-order-quote-decision/).
  - name: tracking
    description: >
      Customer-facing, JWT-free service order tracking (RF12,
      specs/service-order-tracking/) and quote approval/rejection
      (specs/service-order-quote-decision/). Authenticates with a per-order
      tracking token instead of the administrative JWT.

paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Administrative login
      description: >
        Issues a JWT for an administrative user (specs/auth/design.md Â§4).
        The identifier is e-mail; unknown e-mail and wrong password return
        the exact same 401 body so a client cannot enumerate users (BR4).
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              admin:
                summary: Seeded dev admin (docs/seed.sql)
                value:
                  email: admin@workshop.local
                  password: admin123
      responses:
        "200":
          description: A bearer token, valid for the TTL configured via `JWT_TTL` (default 1h).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Malformed JSON body, or a missing email/password (code `INVALID_REQUEST`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: >
            Unknown e-mail or wrong password (code `UNAUTHORIZED`) â€”
            deliberately identical for both cases (BR4).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Retrieve the authenticated user's own identity
      operationId: getCurrentUser
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The authenticated administrative user (never includes the password hash).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: >
            Missing, malformed, or expired bearer token (code
            `UNAUTHORIZED`), or the token's subject no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/customers:
    post:
      tags: [customers]
      summary: Register a new customer
      operationId: createCustomer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
            examples:
              individual:
                summary: Individual (CPF)
                value:
                  name: Maria Silva
                  document: "123.456.789-09"
                  phone: "+55 11 91234-5678"
                  email: maria@example.com
              company:
                summary: Company (CNPJ)
                value:
                  name: Transportadora Rota Sul Ltda
                  document: "12.345.678/0001-90"
                  phone: "+55 11 3333-4444"
      responses:
        "201":
          description: Customer created, always with status ACTIVE.
          headers:
            Location:
              description: URL of the newly created customer.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          description: Missing required field, or CPF/CNPJ failed check-digit validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, malformed, or expired bearer token.
        "409":
          description: >
            The document already belongs to another customer (code `DUPLICATE_DOCUMENT`),
            or the e-mail already belongs to another customer (code `DUPLICATE_EMAIL`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags: [customers]
      summary: List customers (active and inactive)
      operationId: listCustomers
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of customers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"
        "401":
          description: Missing, malformed, or expired bearer token.

  /api/v1/customers/{id}:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      tags: [customers]
      summary: Retrieve a customer by id
      operationId: getCustomerById
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: No customer with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags: [customers]
      summary: Partially update a customer
      description: >
        Only the fields present in the request body are changed; omitted
        fields keep their current value. If `document` is present, it is
        normalized, re-validated, and re-checked for uniqueness.
      operationId: updateCustomer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequest"
      responses:
        "200":
          description: The updated customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          description: The updated document failed check-digit validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: No customer with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: >
            The updated document already belongs to another customer (code
            `DUPLICATE_DOCUMENT`), or the updated e-mail already belongs to another customer
            (code `DUPLICATE_EMAIL`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [customers]
      summary: Logically deactivate a customer
      description: >
        Soft delete: sets status to INACTIVE. The record is never physically
        removed and remains fully queryable. Idempotent â€” deactivating an
        already-inactive customer returns 200 with no change. There is no
        endpoint to reactivate a customer in this feature.
      operationId: deactivateCustomer
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The now-inactive customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: No customer with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/customers/document/{document}:
    get:
      tags: [customers]
      summary: Retrieve a customer by document (CPF/CNPJ)
      description: The path parameter is normalized (punctuation stripped) before lookup.
      operationId: getCustomerByDocument
      security: [{ bearerAuth: [] }]
      parameters:
        - name: document
          in: path
          required: true
          description: CPF or CNPJ, formatted or already normalized.
          schema:
            type: string
          example: "123.456.789-09"
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: No customer with this document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/vehicles:
    post:
      tags: [vehicles]
      summary: Register a new vehicle
      description: >
        The referenced customerId must belong to an existing, ACTIVE
        customer. The vehicle always starts ACTIVE.
      operationId: createVehicle
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVehicleRequest"
            examples:
              vehicle:
                summary: Mercosul-format plate
                value:
                  licensePlate: ABC1D23
                  brand: Fiat
                  model: Uno
                  year: 2018
                  color: White
                  customerId: a0000000-0000-0000-0000-000000000001
      responses:
        "201":
          description: Vehicle created, always with status ACTIVE.
          headers:
            Location:
              description: URL of the newly created vehicle.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "400":
          description: Missing required field, invalid license plate format, or year out of range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: The referenced customerId does not exist (code `CUSTOMER_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: >
            The referenced customer exists but is INACTIVE (code
            `CUSTOMER_INACTIVE`), or the license plate already belongs to
            another vehicle (code `DUPLICATE_LICENSE_PLATE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags: [vehicles]
      summary: List vehicles (active and inactive)
      operationId: listVehicles
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of vehicles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleList"
        "401":
          description: Missing, malformed, or expired bearer token.

  /api/v1/vehicles/{id}:
    parameters:
      - $ref: "#/components/parameters/VehicleId"
    get:
      tags: [vehicles]
      summary: Retrieve a vehicle by id
      operationId: getVehicleById
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The vehicle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: No vehicle with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags: [vehicles]
      summary: Partially update a vehicle
      description: >
        Only brand, model, year, and color may be updated; the license plate
        and the owning customer are immutable after creation and are not
        accepted by this endpoint. Omitted fields keep their current value.
      operationId: updateVehicle
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVehicleRequest"
      responses:
        "200":
          description: The updated vehicle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "400":
          description: The updated year is out of range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: No vehicle with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [vehicles]
      summary: Logically deactivate a vehicle
      description: >
        Soft delete: sets status to INACTIVE. The record is never physically
        removed and remains fully queryable. Idempotent â€” deactivating an
        already-inactive vehicle returns 200 with no change. There is no
        endpoint to reactivate a vehicle in this feature.
      operationId: deactivateVehicle
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The now-inactive vehicle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: No vehicle with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/vehicles/plate/{plate}:
    get:
      tags: [vehicles]
      summary: Retrieve a vehicle by license plate
      description: The path parameter is normalized (formatting stripped, uppercased) before lookup.
      operationId: getVehicleByPlate
      security: [{ bearerAuth: [] }]
      parameters:
        - name: plate
          in: path
          required: true
          description: Legacy (AAA9999) or Mercosul (AAA9A99) plate, formatted or already normalized.
          schema:
            type: string
          example: ABC1D23
      responses:
        "200":
          description: The vehicle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: No vehicle with this plate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/vehicles/customer/{customerId}:
    get:
      tags: [vehicles]
      summary: List a customer's vehicles
      description: >
        An existing customer with no vehicles returns 200 with an empty data
        array. An inactive customer's vehicles are still listed â€” inactivity
        only affects future service-order eligibility, not visibility.
      operationId: listVehiclesByCustomer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of the customer's vehicles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleList"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: No customer with this id (code `CUSTOMER_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/services:
    post:
      tags: [services]
      summary: Register a new catalog service
      description: >
        specs/service-catalog/design.md Â§D1: `code` is optional â€” when
        omitted, the database generates the sequential identifier; when
        present, a collision with an existing service's code is rejected.
      operationId: createCatalogService
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogServiceRequest"
            examples:
              autoCode:
                summary: Database-generated code
                value:
                  name: Oil Change
                  description: Engine oil and filter replacement.
                  price: 120.5
                  estimated_time: 45
              explicitCode:
                summary: Caller-supplied code
                value:
                  code: 42
                  name: Wheel Alignment
                  description: Four-wheel alignment.
                  price: 89.9
      responses:
        "201":
          description: The created service, always with active true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogService"
        "400":
          description: >
            Malformed JSON body (code `INVALID_BODY`), or a missing/invalid
            field â€” empty name, negative price, non-positive code or
            estimated_time (code `VALIDATION_ERROR`, BR1/BR2/BR3/BR4).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, malformed, or expired bearer token.
        "409":
          description: The supplied code already belongs to another service (code `CODE_ALREADY_EXISTS`, BR2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags: [services]
      summary: List catalog services
      description: >
        Ordered by code. Not paginated â€” the `{"items": [...]}` envelope is
        used instead of the page/pageSize/total/totalPages shape (see
        CLAUDE.md Â§8's "Collection responses" note, which this endpoint
        first established).
      operationId: listCatalogServices
      security: [{ bearerAuth: [] }]
      parameters:
        - name: active
          in: query
          description: Filter by active/inactive. Omitted returns both.
          schema:
            type: boolean
      responses:
        "200":
          description: Every matching service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogServiceList"
        "400":
          description: The `active` filter is not `true`/`false` (code `VALIDATION_ERROR`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, malformed, or expired bearer token.

  /api/v1/services/{id}:
    parameters:
      - $ref: "#/components/parameters/CatalogServiceId"
    get:
      tags: [services]
      summary: Retrieve a catalog service by id
      operationId: getCatalogServiceById
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogService"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: No service with this id (code `NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags: [services]
      summary: Partially update a catalog service
      description: >
        Every field is optional; at least one must be present. Omitted
        fields keep their current value. Changing a service's price never
        alters quotes already generated (BR5), since a quote stores its own
        price snapshot.
      operationId: updateCatalogService
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCatalogServiceRequest"
      responses:
        "200":
          description: The updated service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogService"
        "400":
          description: >
            Malformed JSON body (code `INVALID_BODY`), or an invalid/empty
            field, or a request with no updatable field at all (code
            `VALIDATION_ERROR`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: No service with this id (code `NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [services]
      summary: Logically deactivate a catalog service
      description: >
        Soft delete: sets active to false, preserving history (BR7). An
        inactive service must not be used in new quotes (BR6). Idempotent â€”
        deactivating an already-inactive service still succeeds.
      operationId: deactivateCatalogService
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Deactivated. No response body.
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: No service with this id (code `NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/products:
    post:
      tags: [products]
      summary: Register a new product (part or supply)
      operationId: createProduct
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
            examples:
              part:
                summary: A replacement part
                value:
                  name: Filtro de Ã“leo
                  description: Filtro de Ã³leo compatÃ­vel com motores 1.0/1.6.
                  unitPrice: 35.9
                  currentStock: 50
                  type: PART
      responses:
        "201":
          description: The created product, always ACTIVE.
          headers:
            Location:
              description: URL of the newly created product.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: >
            Malformed JSON body (code `INVALID_BODY`), or a missing/invalid
            field â€” empty name, missing/negative unitPrice, missing/negative
            currentStock, non-positive code, or type not PART/SUPPLY (code
            `VALIDATION_ERROR`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, malformed, or expired bearer token.
        "409":
          description: The supplied code already belongs to another product (code `DUPLICATE_CODE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags: [products]
      summary: List products (paginated, filterable)
      operationId: listProducts
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: type
          in: query
          description: Filter by product type.
          schema:
            type: string
            enum: [PART, SUPPLY]
        - name: status
          in: query
          description: Filter by product status.
          schema:
            type: string
            enum: [ACTIVE, INACTIVE]
      responses:
        "200":
          description: A page of products.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "401":
          description: Missing, malformed, or expired bearer token.

  /api/v1/products/{id}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      tags: [products]
      summary: Retrieve a product by id
      operationId: getProductById
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: "{id} is not a valid UUID (code `INVALID_BODY`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: No product with this id (code `NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags: [products]
      summary: Partially update a product's cadastral data
      description: >
        Name, description, unitPrice, and type may be updated. `currentStock`
        is deliberately not modifiable through this endpoint (RNF07) â€” a
        request that includes it is rejected wholesale, even alongside other,
        otherwise-valid fields; use POST .../stock/adjustments instead.
      operationId: updateProduct
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: The updated product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: >
            Malformed JSON body, `currentStock` present (code
            `VALIDATION_ERROR`, RNF07), empty name, negative unitPrice, or
            type not PART/SUPPLY.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: No product with this id (code `NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [products]
      summary: Logically deactivate a product
      description: >
        Soft delete: sets status to INACTIVE. Idempotent. An inactive
        product must not be used in new quotes or stock adjustments.
      operationId: deactivateProduct
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The now-inactive product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: No product with this id (code `NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/products/{id}/stock/adjustments:
    post:
      tags: [products]
      summary: Register a stock adjustment (entry or exit)
      description: >
        Applied atomically at the database level (RNF07): an EXIT is
        rejected as 409 if it would take `currentStock` negative, closing
        the race between two concurrent adjustments (RN01). The product must
        be ACTIVE.
      operationId: adjustProductStock
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAdjustmentRequest"
            examples:
              entry:
                summary: Stock entry
                value:
                  type: ENTRY
                  quantity: 10
                  reason: Ajuste de inventÃ¡rio anual
      responses:
        "201":
          description: The created stock movement record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductStockMovement"
        "400":
          description: >
            Malformed JSON body, type not ENTRY/EXIT, non-positive quantity,
            or empty reason (code `VALIDATION_ERROR`, RN01).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: No product with this id (code `NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: >
            An EXIT would take `currentStock` negative (code
            `INSUFFICIENT_STOCK`, RN01), or the product is inactive (code
            `VALIDATION_ERROR`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/products/{id}/stock:
    get:
      tags: [products]
      summary: Retrieve a product's current stock balance
