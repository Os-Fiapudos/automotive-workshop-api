  /api/v1/service-orders:
    post:
      tags: [service-orders]
      summary: Open a new service order
      description: >
        Requires a valid JWT (wrapped in bearerAuth on 2026-08-26, CLAUDE.md
        §1). Exactly one of customerId/customerDocument and exactly
        one of vehicleId/licensePlate must be present (specs/service-order-opening/design.md
        Â§4.1). Any `status` field sent in the body is ignored â€” the server
        is the only author of a new order's status, which always starts
        RECEIVED (requirements.md Â§3.6). requestedServiceIds and notes are
        optional.
      operationId: createServiceOrder
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceOrderRequest"
            examples:
              byId:
                summary: Customer/vehicle identified by id
                value:
                  customerId: a0000000-0000-0000-0000-000000000001
                  vehicleId: b0000000-0000-0000-0000-000000000001
                  requestedServiceIds: [d0000000-0000-0000-0000-000000000001]
                  notes: Customer reported a light engine noise.
              byDocumentAndPlate:
                summary: Customer/vehicle identified by document/plate
                value:
                  customerDocument: "123.456.789-09"
                  licensePlate: ABC1D23
                  requestedServiceIds: []
                  notes: Routine check.
      responses:
        "201":
          description: >
            The created order, status RECEIVED. `trackingToken` is the raw
            customer-tracking token (specs/service-order-tracking/design.md
            Â§5) â€” returned only here, once, and never logged (RNF08).
          headers:
            Location:
              description: URL of the newly created service order.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrderCreateResponse"
        "400":
          description: >
            Malformed JSON body (code `INVALID_BODY`), or not exactly one
            customer/vehicle identifier pair given (code `VALIDATION_ERROR`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: >
            The referenced customer (code `NOT_FOUND`), vehicle (code
            `NOT_FOUND`), or a requested service id (code `NOT_FOUND`) does
            not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: >
            The referenced customer is inactive (code `CUSTOMER_INACTIVE`),
            the referenced vehicle is inactive (code `VEHICLE_INACTIVE`), or
            the vehicle does not belong to the identified customer (code
            `VEHICLE_NOT_OWNED_BY_CUSTOMER`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags: [service-orders]
      summary: List service orders (paginated, filterable)
      description: >
        Most recent orders first (by creation date, order code as a
        tiebreaker). All filters are optional and combine with AND.
      operationId: listServiceOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - name: code
          in: query
          description: Exact match on the service order's sequential code.
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          description: Exact match on the service order's status.
          schema:
            type: string
            enum:
              [
                RECEIVED,
                IN_DIAGNOSIS,
                AWAITING_APPROVAL,
                IN_PROGRESS,
                COMPLETED,
                DELIVERED,
                CANCELED,
              ]
        - name: document
          in: query
          description: Customer CPF/CNPJ, formatted or unformatted (normalized before matching).
          schema:
            type: string
          example: "123.456.789-09"
        - name: licensePlate
          in: query
          description: Vehicle license plate, legacy or Mercosul format.
          schema:
            type: string
          example: ABC1D23
        - name: createdFrom
          in: query
          description: Inclusive lower bound on the order's creation date/time (RFC3339).
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          description: Inclusive upper bound on the order's creation date/time (RFC3339).
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of service orders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrderList"
        "400":
          description: An invalid filter value (e.g. an unknown status, or a non-integer code/malformed date).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, malformed, or expired bearer token.

  /api/v1/service-orders/{id}:
    get:
      tags: [service-orders]
      summary: Retrieve a service order's full detail, by id or by code
      description: >
        {id} accepts either the order's technical id (a UUID) or its
        sequential code (an integer) â€” the two value spaces never overlap, so
        the server tells them apart automatically. Both forms return the same
        ServiceOrderDetail shape: customer, vehicle, status, notes, the
        services requested at opening, the composed quote (its item values
        are the quote's own stored snapshot, never the catalog's current
        price â€” absent/null when no quote has been composed yet), and the
        full status-change history, oldest first. A related customer,
        vehicle, product, or service that has since become inactive is still
        shown.
      operationId: getServiceOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: The service order's UUID or its sequential code.
          schema:
            type: string
          examples:
            byId:
              summary: By technical id
              value: "b0000000-0000-0000-0000-000000000001"
            byCode:
              summary: By sequential code
              value: "1"
      responses:
        "200":
          description: The service order's full detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrderDetail"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: >
            No service order with this id/code, or {id} is neither a valid
            UUID nor a valid integer (code `NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/service-orders/{id}/diagnosis:
    post:
      tags: [service-orders]
      summary: Start diagnosis on a service order
      description: >
        Transitions the order from RECEIVED to IN_DIAGNOSIS
        (specs/service-order-diagnosis-quote/requirements.md Â§3.1). No
        request body.
      operationId: startServiceOrderDiagnosis
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ServiceOrderId"
      responses:
        "200":
          description: The order's new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrderStatusResponse"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: No service order with this id (code `NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The order is not RECEIVED (code `INVALID_STATUS_TRANSITION`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/service-orders/{id}/quote:
    parameters:
      - $ref: "#/components/parameters/ServiceOrderId"
    put:
      tags: [service-orders]
      summary: Compose (or recompose) a service order's quote
      description: >
        Replaces the order's quote wholesale with the given items; the
        total is always computed server-side (RF06) â€” there is no
        client-sendable total/totalAmount field. Recomposition is allowed
        any number of times while the quote is still PENDING and the order
        has left RECEIVED; each item resolves and snapshots its price from
        the product/service catalog at compose time
        (specs/service-order-diagnosis-quote/requirements.md Â§3.2, Â§3.9,
        Â§3.11, Â§3.12). This no longer transitions the order's status â€” only
        POST .../quote/send does (specs/service-order-quote-decision/).
      operationId: composeServiceOrderQuote
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeQuoteRequest"
            examples:
              mixed:
                summary: One product line, one service line
                value:
                  items:
                    - productId: c0000000-0000-0000-0000-000000000001
                      quantity: 2
                    - serviceId: d0000000-0000-0000-0000-000000000001
                      quantity: 1
      responses:
        "200":
          description: The composed quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrderQuote"
        "400":
          description: >
            Malformed JSON body, an item missing exactly one of
            productId/serviceId (code `VALIDATION_ERROR`), an empty item
            list (code `VALIDATION_ERROR`, `ErrEmptyQuote`), or a
            non-positive quantity (code `VALIDATION_ERROR`,
            `ErrInvalidQuantity`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: >
            No service order with this id (code `NOT_FOUND`), or a
            referenced product/service does not exist (code `NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: >
            Diagnosis has not started â€” order still RECEIVED (code
            `DIAGNOSIS_NOT_STARTED`), the quote has already been decided
            (code `QUOTE_ALREADY_DECIDED`), or a referenced product is
            inactive (code `PRODUCT_INACTIVE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags: [service-orders]
      summary: Retrieve a service order's current quote
      operationId: getServiceOrderQuote
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrderQuote"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: >
            No service order with this id (code `NOT_FOUND`), or no quote
            has been composed yet (code `NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/service-orders/{id}/quote/send:
    post:
      tags: [service-orders]
      summary: Send a service order's composed quote to the customer
      description: >
        Only a complete quote (at least one item) can be sent, and only
        while the order is IN_DIAGNOSIS â€” sending is what moves it to
        AWAITING_APPROVAL (specs/service-order-quote-decision/). No
        request body. Notification to the customer is best-effort: the MVP
        has no real e-mail integration, and a notification failure never
        undoes or blocks the already-recorded send.
      operationId: sendServiceOrderQuote
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ServiceOrderId"
      responses:
        "200":
          description: The sent quote (now carrying `sentAt`/`sentVersion`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrderQuote"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: >
            No service order with this id (code `NOT_FOUND`), or no quote
            has been composed yet (code `NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: >
            The order is not IN_DIAGNOSIS (code
            `INVALID_STATUS_TRANSITION`), or the quote has no items (code
            `VALIDATION_ERROR`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/service-orders/{id}/executions:
    post:
      tags: [service-orders]
      summary: Start a service's execution within a service order
      description: >
        The order must already be IN_PROGRESS (an external precondition
        this feature does not itself produce â€” see
        specs/service-order-execution/requirements.md Â§2.1) and the
        referenced service must exist in the catalog.
      operationId: startServiceOrderExecution
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ServiceOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartExecutionRequest"
            examples:
              start:
                value:
                  serviceId: d0000000-0000-0000-0000-000000000001
      responses:
        "201":
          description: The started execution (endedAt null).
          headers:
            Location:
              description: URL of the newly created execution.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceExecution"
        "400":
          description: Malformed JSON body, or missing serviceId (code `VALIDATION_ERROR`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: >
            No service order with this id (code `NOT_FOUND`), or the
            referenced service does not exist (code `NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The order is not IN_PROGRESS (code `INVALID_STATUS_TRANSITION`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/service-orders/{id}/executions/{executionId}/finish:
    post:
      tags: [service-orders]
      summary: Record the end of a previously started service execution
      description: >
        endedAt is optional in the request body â€” an omitted or empty body
        means "now" (design.md Â§2.5). The order must still be IN_PROGRESS â€”
        a finalized order accepts no more finishes (BR6).
      operationId: finishServiceOrderExecution
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ServiceOrderId"
        - $ref: "#/components/parameters/ExecutionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishExecutionRequest"
      responses:
        "200":
          description: The finished execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceExecution"
        "400":
          description: >
            Malformed JSON body, or endedAt is before the execution's
            startedAt (code `VALIDATION_ERROR`, BR4).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: >
            No service order with this id (code `NOT_FOUND`), or no
            execution with this executionId on this order (code
            `NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: >
            The order is not IN_PROGRESS (code `INVALID_STATUS_TRANSITION`),
            or the execution was already finished (code
            `SERVICE_EXECUTION_ALREADY_FINISHED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/service-orders/{id}/finalize:
    post:
      tags: [service-orders]
      summary: Finalize a service order
      description: >
        Transitions the order from IN_PROGRESS to COMPLETED once every
        required execution â€” one per distinct service line item of its
        approved quote â€” has been finished (BR5). No request body.
      operationId: finalizeServiceOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ServiceOrderId"
      responses:
        "200":
          description: The order's new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrderStatusResponse"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: No service order with this id (code `NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: >
            The order is not IN_PROGRESS (code `INVALID_STATUS_TRANSITION`),
            or it has pending, unfinished executions (code
            `EXECUTIONS_NOT_COMPLETED`, BR5).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/service-orders/{id}/deliver:
    post:
      tags: [service-orders]
      summary: Mark a service order as delivered to the customer
      description: >
        Transitions the order from COMPLETED to DELIVERED (BR7). No request
        body.
      operationId: deliverServiceOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ServiceOrderId"
      responses:
        "200":
          description: The order's new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrderStatusResponse"
        "401":
          description: Missing, malformed, or expired bearer token.
        "404":
          description: No service order with this id (code `NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The order is not COMPLETED (code `INVALID_STATUS_TRANSITION`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/service-orders/metrics/average-execution-time:
    get:
      tags: [service-orders]
      summary: Average service execution time, grouped by service
      description: >
        specs/service-order-metrics/. Only completed executions (with an
        endedAt) participate; a still-in-progress execution is excluded, not
        treated as zero. Duration is reported in minutes
        (averageDurationMinutes). A service with no completed execution is
        absent from the result rather than shown with a zero count; no data
        at all (or a filter matching nothing) returns 200 with an empty
        `services` array, never an error. All filters are optional and
        combine with AND.
      operationId: getAverageExecutionTime
      security: [{ bearerAuth: [] }]
      parameters:
        - name: serviceId
          in: query
          description: Restrict the result to a single service.
          schema:
            type: string
            format: uuid
        - name: startDate
          in: query
          description: Inclusive lower bound on the execution's start date/time (RFC3339).
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Inclusive upper bound on the execution's start date/time (RFC3339).
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: One entry per service with at least one completed execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AverageExecutionTimeResponse"
        "400":
          description: An invalid filter value (malformed serviceId, startDate, or endDate).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, malformed, or expired bearer token.

  /api/v1/acompanhamento/{codigo}:
    get:
      tags: [tracking]
      summary: Look up a service order's public tracking view
      description: >
        Customer-facing read view (RF12) â€” never accepts or requires the
        administrative JWT (specs/service-order-tracking/requirements.md
        AC10); authenticates with the X-Tracking-Token header instead (see
        the trackingToken security scheme). The response is a deliberately
        limited projection, distinct from the administrative
        ServiceOrderDetail: only the order's code, current status, a partial
        vehicle identification (license plate, brand, model, year, color â€”
        no id/code/status/owning customer), and the milestone trail (event,
        previous/new status, occurredAt â€” no free-text description). Customer
        PII (CPF/CNPJ, phone, e-mail), internal ids, and any other order are
        never present (AC6-AC9).
      operationId: getServiceOrderTracking
      security:
        - trackingToken: []
      parameters:
        - name: codigo
          in: path
          required: true
          description: The service order's sequential code.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The service order's public tracking view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrderTracking"
        "401":
          description: >
            The X-Tracking-Token header is missing, malformed, wrong,
            belongs to a different service order, or has been revoked (code
            `INVALID_TRACKING_TOKEN`) â€” all deliberately indistinguishable
            from each other, so a wrong token never reveals which specific
            way it was wrong (AC2, AC4, AC5).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >
            No service order with this code, or {codigo} is not a valid
            integer (code `NOT_FOUND`) â€” checked before the token, so it
            takes precedence regardless of what token was supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/acompanhamento/{codigo}/orcamento/aprovar:
    post:
      tags: [tracking]
      summary: Approve a service order's sent quote (customer-facing)
      description: >
        Customer-facing decision endpoint (specs/service-order-quote-decision/)
        â€” never accepts or requires the administrative JWT; authenticates
        with the X-Tracking-Token header instead, same convention as
        GET /api/v1/acompanhamento/{codigo}. Approving moves the order from
        AWAITING_APPROVAL to IN_PROGRESS. No request body.
      operationId: approveServiceOrderQuote
      security:
        - trackingToken: []
      parameters:
        - name: codigo
          in: path
          required: true
          description: The service order's sequential code.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: >
            The reduced, public decision projection â€” no internal ids, no
            item breakdown (same "reduced read projection" principle as
            ServiceOrderTracking).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrderQuoteDecision"
        "401":
          description: >
            The X-Tracking-Token header is missing, malformed, wrong,
            belongs to a different service order, or has been revoked (code
            `INVALID_TRACKING_TOKEN`) â€” all deliberately indistinguishable
            from each other.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: >
            No service order with this code (code `NOT_FOUND`) â€” checked
            before the token, so it takes precedence regardless of what
            token was supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: >
            The quote has already been decided â€” approved or rejected
            already (code `QUOTE_ALREADY_DECIDED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/acompanhamento/{codigo}/orcamento/reprovar:
    post:
      tags: [tracking]
      summary: Reject a service order's sent quote (customer-facing)
      description: >
        Same authentication and precedence rules as .../orcamento/aprovar.
        Rejecting moves the order from AWAITING_APPROVAL to CANCELED â€”
        the closing status decided for a rejected quote, since a REJECTED
        quote can never be altered
        (specs/service-order-diagnosis-quote/requirements.md Â§3.9) and the
        order would otherwise have no way to leave AWAITING_APPROVAL. No
        request body.
      operationId: rejectServiceOrderQuote
      security:
        - trackingToken: []
      parameters:
        - name: codigo
          in: path
          required: true
          description: The service order's sequential code.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The reduced, public decision projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrderQuoteDecision"
        "401":
          description: >
            The X-Tracking-Token header is missing, malformed, wrong,
            belongs to a different service order, or has been revoked (code
            `INVALID_TRACKING_TOKEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No service order with this code (code `NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The quote has already been decided (code `QUOTE_ALREADY_DECIDED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Required on every Vehicle Management route, every Service catalog and
        Product Management route, GET /api/v1/auth/me, and every Service
        Order route except creation (RNF02) â€” that includes the Service
        Order Query routes plus the diagnosis/quote/execution routes added by
        specs/service-order-diagnosis-quote/,
        specs/service-order-quote-decision/ (only its send-quote endpoint;
        approve/reject are customer-facing, see trackingToken), and
        specs/service-order-execution/. Not required on Customer Management
        routes (see specs/customer-management/requirements.md Â§7.2) nor on
        POST /api/v1/service-orders (CLAUDE.md Â§1), and not accepted at all
        by the Service Order Tracking route or the customer-facing quote
        approve/reject routes (see trackingToken).
    trackingToken:
      type: apiKey
      in: header
      name: X-Tracking-Token
      description: >
        Per-service-order token, issued once as the trackingToken field of
        POST /api/v1/service-orders's creation response (there is no
        separate issuance endpoint). Deliberately a distinct header, not
        Authorization: Bearer, so it can never be confused with the
        administrative JWT (specs/service-order-tracking/requirements.md Â§0).

  parameters:
    CustomerId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VehicleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CatalogServiceId:
      name: id
      in: path
      required: true
      description: The catalog service's technical UUID.
      schema:
        type: string
        format: uuid
    ProductId:
      name: id
      in: path
      required: true
      description: The product's technical UUID.
      schema:
        type: string
        format: uuid
    ServiceOrderId:
      name: id
      in: path
      required: true
      description: >
        The service order's technical UUID. Unlike
        GET /api/v1/service-orders/{id}, this parameter never accepts the
        sequential code â€” every route that uses it only ever looks the order
        up by UUID.
      schema:
        type: string
        format: uuid
    ExecutionId:
      name: executionId
      in: path
      required: true
      description: The service execution's technical UUID.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: 1-indexed page number. Defaults to 1; values below 1 fall back to the default.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Items per page. Defaults to 20; clamped to a maximum of 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    CreateCustomerRequest:
      type: object
      required: [name, document, phone]
      properties:
        name:
          type: string
          example: Maria Silva
        document:
          type: string
          description: >
            CPF (11 digits) or CNPJ (14 characters â€” digits, or, since July 2026, uppercase
            letters A-Z in the first 12 with numeric check digits), with or without
            punctuation.
          example: "123.456.789-09"
        phone:
          type: string
          example: "+55 11 91234-5678"
        email:
          type: string
          format: email
          nullable: true

    UpdateCustomerRequest:
      type: object
      description: Every field is optional; omitted fields are left unchanged.
      properties:
        name:
          type: string
        document:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email

    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: integer
          format: int64
          description: Human-readable sequential identifier.
        name:
          type: string
        document:
          type: string
          description: >
            Always normalized. CPF is 11 digits. CNPJ is 14 characters: digits, or (since
            the Receita Federal alphanumeric CNPJ format, in effect since July 2026)
            uppercase letters A-Z in the first 12 characters, with the last 2 always
            numeric (the check digits).
          example: "12345678909"
        documentType:
          type: string
          enum: [CPF, CNPJ]
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CustomerList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    CreateVehicleRequest:
      type: object
      required: [licensePlate, brand, model, year, color, customerId]
      properties:
        licensePlate:
          type: string
          description: Legacy (AAA9999) or Mercosul (AAA9A99) format, with or without punctuation.
          example: ABC1D23
        brand:
          type: string
          example: Fiat
        model:
          type: string
          example: Uno
        year:
          type: integer
          description: Manufacturing year, between 1950 and the current year + 1.
          example: 2018
        color:
          type: string
          example: White
        customerId:
          type: string
          format: uuid
          description: Must reference an existing, ACTIVE customer.

    UpdateVehicleRequest:
      type: object
      description: >
        Every field is optional; omitted fields are left unchanged. License
        plate and customerId are not part of this request's shape â€” they are
        immutable after creation.
      properties:
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
        color:
          type: string

    Vehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: integer
          format: int64
          description: Human-readable sequential identifier.
        licensePlate:
          type: string
          description: Always normalized (uppercase, formatting stripped).
          example: ABC1D23
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
        color:
          type: string
        customerId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    VehicleList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Vehicle"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    ServiceOrderCustomerSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: integer
          format: int64
        name:
          type: string

    ServiceOrderVehicleSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: integer
          format: int64
        licensePlate:
          type: string

    ServiceOrderListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: integer
          format: int64
        customer:
          $ref: "#/components/schemas/ServiceOrderCustomerSummary"
        vehicle:
          $ref: "#/components/schemas/ServiceOrderVehicleSummary"
        status:
          type: string
          enum:
            [
              RECEIVED,
              IN_DIAGNOSIS,
              AWAITING_APPROVAL,
              IN_PROGRESS,
              COMPLETED,
              DELIVERED,
              CANCELED,
            ]
        openedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ServiceOrderList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ServiceOrderListItem"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    AverageExecutionTimeResponse:
      type: object
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceMetric"

    ServiceMetric:
      type: object
      properties:
        serviceId:
          type: string
          format: uuid
        serviceCode:
          type: integer
          format: int64
        serviceName:
          type: string
        executionCount:
          type: integer
        averageDurationMinutes:
          type: number
          format: double
          description: Average execution duration, in minutes.

    ServiceOrderCustomerDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: integer
          format: int64
        name:
          type: string
        document:
          type: string
        phone:
          type: string

    ServiceOrderVehicleDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: integer
          format: int64
        licensePlate:
          type: string
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
        color:
          type: string

    ServiceOrderRequestedService:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: integer
          format: int64
        name:
          type: string

    ServiceOrderQuoteItem:
      type: object
      description: >
        Description/unitPrice/total are the quote's own stored snapshot from
        the moment the item was composed, never the catalog's current price
        (specs/service-order-diagnosis-quote/).
      properties:
        productId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        description:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          format: double
        total:
          type: number
          format: double

    ServiceOrderQuote:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: integer
          format: int64
        serviceOrderId:
          type: string
          format: uuid
        totalAmount:
          type: number
          format: double
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        version:
          type: integer
          description: >
            Incremented on every (re)composition (specs/service-order-quote-decision/).
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceOrderQuoteItem"
        generatedAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true
          description: When this quote was sent to the customer via POST .../quote/send. Absent/null until sent.
        sentVersion:
          type: integer
          nullable: true
          description: The `version` value that was sent, so a later recomposition can be told apart from what the customer actually saw.
        respondedAt:
          type: string
          format: date-time
          nullable: true

    ServiceOrderHistoryEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        event:
          type: string
          enum:
            [
              creation,
              diagnosis_started,
              quote_composed,
              quote_sent,
              approval,
              completion,
              cancellation,
              delivery,
            ]
        description:
          type: string
        previousStatus:
          type: string
        newStatus:
          type: string

    ServiceOrderDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: integer
          format: int64
        customer:
          $ref: "#/components/schemas/ServiceOrderCustomerDetail"
        vehicle:
          $ref: "#/components/schemas/ServiceOrderVehicleDetail"
        status:
          type: string
          enum:
            [
              RECEIVED,
              IN_DIAGNOSIS,
              AWAITING_APPROVAL,
              IN_PROGRESS,
              COMPLETED,
              DELIVERED,
              CANCELED,
            ]
        notes:
          type: string
        requestedServices:
          type: array
          items:
            $ref: "#/components/schemas/ServiceOrderRequestedService"
        quote:
          allOf:
            - $ref: "#/components/schemas/ServiceOrderQuote"
          nullable: true
          description: Absent/null until a quote has been composed.
        history:
          type: array
          items:
            $ref: "#/components/schemas/ServiceOrderHistoryEntry"
        openedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ServiceOrderTrackingVehicle:
      type: object
      description: >
        Deliberately partial â€” no id, code, status, or owning customer
        (specs/service-order-tracking/requirements.md AC6).
      properties:
        licensePlate:
          type: string
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
        color:
          type: string

    ServiceOrderTrackingMilestone:
      type: object
      description: >
        A status-change event, without the internal id or free-text
        description an administrative history entry carries (AC6).
      properties:
        event:
          type: string
          enum:
            [
              creation,
              diagnosis_started,
              quote_composed,
              quote_sent,
              approval,
              completion,
              cancellation,
              delivery,
            ]
        previousStatus:
          type: string
        newStatus:
          type: string
        occurredAt:
          type: string
          format: date-time

    ServiceOrderTracking:
      type: object
      description: >
        The public tracking contract â€” a distinct type from the
        administrative ServiceOrderDetail, with no shared fields beyond code
        and status (AC9). Never contains CPF/CNPJ, phone, e-mail, internal
        ids, or any other service order (AC7, AC8).
      properties:
        code:
          type: integer
          format: int64
        status:
          type: string
          enum:
            [
              RECEIVED,
              IN_DIAGNOSIS,
              AWAITING_APPROVAL,
              IN_PROGRESS,
              COMPLETED,
              DELIVERED,
              CANCELED,
            ]
        vehicle:
          $ref: "#/components/schemas/ServiceOrderTrackingVehicle"
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/ServiceOrderTrackingMilestone"

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                [
                  INVALID_BODY,
                  VALIDATION_ERROR,
                  NOT_FOUND,
                  DUPLICATE_DOCUMENT,
                  DUPLICATE_EMAIL,
                  CUSTOMER_NOT_FOUND,
                  CUSTOMER_INACTIVE,
                  DUPLICATE_LICENSE_PLATE,
                  INVALID_TRACKING_TOKEN,
                  INVALID_REQUEST,
                  UNAUTHORIZED,
                  CODE_ALREADY_EXISTS,
                  DUPLICATE_CODE,
                  INSUFFICIENT_STOCK,
                  VEHICLE_INACTIVE,
                  VEHICLE_NOT_OWNED_BY_CUSTOMER,
                  INVALID_STATUS_TRANSITION,
                  DIAGNOSIS_NOT_STARTED,
                  QUOTE_ALREADY_DECIDED,
                  PRODUCT_INACTIVE,
                  SERVICE_EXECUTION_ALREADY_FINISHED,
                  EXECUTIONS_NOT_COMPLETED,
                  INTERNAL_ERROR,
                ]
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
      example:
        error:
          code: VALIDATION_ERROR
          message: invalid customer data
          details:
            - field: document
              message: "CPF \"12345678900\" has invalid check digits"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@workshop.local
        password:
          type: string
          format: password
          example: admin123

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: >
            A signed JWT (HS256). Send it as `Authorization: Bearer
            <access_token>` on protected routes.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds until expiry (`JWT_TTL`, default 3600).

    CurrentUser:
      type: object
      description: The authenticated administrative user's public data â€” never the password hash.
      properties:
        id:
          type: string
          format: uuid
        code:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email

    CreateCatalogServiceRequest:
      type: object
      required: [name, price]
      properties:
        code:
          type: integer
          format: int64
          nullable: true
          description: Optional. When omitted, the database generates the sequential code (D1).
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
          description: Required. Must not be negative (BR3).
        estimated_time:
          type: integer
          nullable: true
          description: Optional, in minutes. When present must be greater than zero (BR4).

    UpdateCatalogServiceRequest:
      type: object
      description: Every field is optional; at least one must be present. Omitted fields keep their current value.
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        estimated_time:
          type: integer

    CatalogService:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        estimated_time:
          type: integer
          nullable: true
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CatalogServiceList:
      type: object
      description: >
        Not the page/pageSize/total/totalPages envelope other list endpoints
        use â€” this listing is not paginated (CLAUDE.md Â§8).
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogService"

    CreateProductRequest:
      type: object
      required: [name, unitPrice, currentStock, type]
      properties:
        code:
          type: integer
          format: int64
          nullable: true
          description: Optional. When omitted, the database generates the sequential code.
        name:
          type: string
        description:
          type: string
        unitPrice:
          type: number
          format: double
          description: Required. Must not be negative.
        currentStock:
          type: integer
          description: Required. Must not be negative.
        type:
          type: string
          enum: [PART, SUPPLY]

    UpdateProductRequest:
      type: object
      description: >
        Every field is optional; omitted fields keep their current value.
        `currentStock` is never part of this request's shape â€” it is
        immutable through this endpoint (RNF07); use
        POST .../stock/adjustments instead.
      properties:
        name:
          type: string
        description:
          type: string
        unitPrice:
          type: number
          format: double
        type:
          type: string
          enum: [PART, SUPPLY]

    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        unitPrice:
          type: number
          format: double
